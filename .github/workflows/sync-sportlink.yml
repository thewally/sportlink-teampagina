name: Sync SportLink data

on:
  schedule:
    # 11:00 en 21:00 UTC = 12:00 en 22:00 NL-tijd (wintertijd) / 13:00 en
    # 23:00 (zomertijd). GitHub-cron kent geen tijdzones en past zich niet
    # aan zomer-/wintertijd aan.
    - cron: '0 11,21 * * *'
    # Zaterdag (wedstrijddag) elk uur van 09:00 t/m 18:00 NL-tijd. 7-17 UTC
    # dekt zowel zomertijd (UTC 7-16 = 09:00-18:00 NL) als wintertijd
    # (UTC 8-17 = 09:00-18:00 NL) — in de "verkeerde" jaarhelft draait er
    # hierdoor één extra, onschuldige sync net buiten het venster.
    - cron: '0 7-17 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sportlink
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync SportLink data
        env:
          SPORTLINK_CLIENT_ID: ${{ secrets.SPORTLINK_CLIENT_ID }}
        run: python3 scripts/sync.py

      - name: Commit changed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in data/ — niets te committen."
          else
            git commit -m "chore(data): sync SportLink teamdata $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
